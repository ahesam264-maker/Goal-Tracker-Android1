name: Unzip project
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: |
          unzip -o project.zip -d _tmp
          if [ "$(ls -A _tmp | wc -l)" -eq 1 ] && [ -d "_tmp/$(ls _tmp)" ]; then SRC="_tmp/$(ls _tmp)"; else SRC=_tmp; fi
          rm -rf "$SRC/.github"
          cp -a "$SRC"/. .
          rm -rf _tmp project.zip
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip project" || echo "nothing to commit"
          git push
